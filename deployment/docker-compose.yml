version: '3.8'

services:
  # --------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: supportsense_db
    restart: always
    environment:
      POSTGRES_DB: supportsense_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql
      - ../database/seeds/001_seed_data.sql:/docker-entrypoint-initdb.d/002_seed_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supportsense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # 2. Express Backend API Service
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: supportsense_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: supportsense_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: supportsense_enterprise_prod_secret_2026
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  # --------------------------------------------------------------------------
  # 3. Python FastAPI AI Microservice (Google Gemini)
  # --------------------------------------------------------------------------
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: supportsense_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-MOCK_GEMINI_KEY_FOR_LOCAL_DEV}
      GEMINI_MODEL_NAME: gemini-1.5-flash

  # --------------------------------------------------------------------------
  # 4. React Frontend (Nginx Static Proxy)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: supportsense_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
